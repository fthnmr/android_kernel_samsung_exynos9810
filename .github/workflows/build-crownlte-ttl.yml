name: build-crownlte-ttl

# Builds gavdoc38's lineage-24.0-xxksu3-susfs2 tree with the netfilter TTL/HL
# targets enabled (plus a few low-risk wins), keeping xxKSU + SUSFS intact.
#
# Required  : NETFILTER_XT_TARGET_TTL, NETFILTER_XT_TARGET_HL   -> -j TTL works
# Optional  : BBR + fq/fq_codel, zram LZ4 default, TMPFS_XATTR   -> tethered perf
# Never     : CONFIG_NF_TABLES  (would move iptables to the nft backend and change
#             how these very rules resolve; stay on legacy xtables)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev python3 zip unzip curl git

      - name: Fetch clang r365631c (matches build.config.common)
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r365631c
          curl -fsSL -o clang.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r365631c.tar.gz"
          tar -xzf clang.tgz -C prebuilts-master/clang/host/linux-x86/clang-r365631c

      - name: Fetch aarch64-linux-android binutils
        run: |
          mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          curl -fsSL -o gcc.tgz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz"
          tar -xzf gcc.tgz -C prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: Enable config symbols
        run: |
          D=arch/arm64/configs/exynos9810-crownlte_defconfig
          add() { grep -q "^$1=" "$D" || echo "$1" >> "$D"; }
          # required: the two targets
          add CONFIG_NETFILTER_XT_TARGET_TTL=y
          add CONFIG_NETFILTER_XT_TARGET_HL=y
          # cheap: matching counterparts, handy for debugging
          add CONFIG_NETFILTER_XT_MATCH_TTL=y
          add CONFIG_NETFILTER_XT_MATCH_HL=y
          # tethered throughput / latency
          add CONFIG_TCP_CONG_ADVANCED=y
          add CONFIG_TCP_CONG_BBR=y
          add CONFIG_NET_SCH_FQ=y
          add CONFIG_NET_SCH_FQ_CODEL=y
          # zram + KernelSU mount needs
          add CONFIG_CRYPTO_LZ4=y
          add CONFIG_CRYPTO_LZ4HC=y
          add CONFIG_ZRAM_DEF_COMP_LZ4=y
          add CONFIG_TMPFS_XATTR=y
          # drop the "-ies" suffix (SUSFS masks uname, but don't ship a tell)
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' "$D" || true
          grep -q '^CONFIG_LOCALVERSION=' "$D" || echo 'CONFIG_LOCALVERSION=""' >> "$D"
          echo "--- appended ---"
          tail -14 "$D"

      - name: Configure
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r365631c/bin:$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            exynos9810-crownlte_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- olddefconfig

      - name: Verify config gate
        run: |
          C=out/.config
          echo "=== must be =y (build fails otherwise) ==="
          for s in NETFILTER_XT_TARGET_TTL NETFILTER_XT_TARGET_HL \
                   NETFILTER_XT_MATCH_TTL NETFILTER_XT_MATCH_HL; do
            v=$(grep -E "^CONFIG_${s}=" "$C" || echo "CONFIG_${s}=MISSING")
            echo "$v"
            case "$v" in *=y) ;; *) echo "FATAL: $s not enabled"; exit 1 ;; esac
          done

          echo "=== KernelSU / SUSFS must survive ==="
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_" "$C" || echo "WARN: no CONFIG_KSU* in .config"
          grep -iE "susfs" "$C" || echo "note: SUSFS has no Kconfig symbol in this tree (source-patched) — expected"

          echo "=== optional: report what actually took effect ==="
          for s in TCP_CONG_BBR NET_SCH_FQ NET_SCH_FQ_CODEL ZRAM_DEF_COMP_LZ4 \
                   TMPFS_XATTR CRYPTO_LZ4HC; do
            grep -E "^CONFIG_${s}=" "$C" || echo "CONFIG_${s} not set"
          done
          grep -E '^CONFIG_DEFAULT_TCP_CONG=' "$C" || true
          grep -E '^CONFIG_LOCALVERSION=' "$C" || true

      - name: Build
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r365631c/bin:$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
