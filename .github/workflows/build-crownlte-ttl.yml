name: build-crownlte-ttl

# Builds gavdoc38's lineage-24.0-xxksu3-susfs2 tree with the netfilter TTL/HL
# targets enabled (plus a few low-risk wins), keeping xxKSU + SUSFS intact.
#
# Toolchain: the distribution clang, not the AOSP prebuilt. The tree's
# build.config.common names clang-r365631c, but fetching it is unreliable --
# gitiles `+archive` on that subdirectory returns "INVALID_ARGUMENT: not
# suitable for the view", the repo's default branch (main-kernel) no longer
# carries it, and cloning from googlesource resets mid-transfer. Ubuntu's clang
# builds this 4.9 tree; kernel config is what we're changing, not the compiler.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # KernelSU is a submodule and drivers/Kconfig includes
          # drivers/kernelsu/Kconfig -- without this the defconfig step dies
          # with "can't open file drivers/kernelsu/Kconfig".
          submodules: recursive

      # The KernelSU submodule has moved past the commit the v3.3.0 release was
      # built with. Building HEAD gives CONFIG_KSU=y but a driver the uapi-v5
      # manager cannot talk to -> "installed" but no `su`. Pin it back so the
      # kernel matches the manager already on the phone.
      - name: Pin KernelSU to the release commit
        run: |
          # The submodule from actions/checkout is shallow, so checking out an
          # older commit fails with "unable to read tree". Clone the repo fresh
          # and swap the directory instead (drivers/kernelsu symlinks into it).
          rm -rf /tmp/ksu
          git clone -q --filter=blob:none https://github.com/gavdoc38/KernelSU.git /tmp/ksu
          cd /tmp/ksu
          git checkout -q 5c595611d1924b1bbc86e84b0766fb91a52c257a
          echo "KernelSU at: $(git log --oneline -1)"
          echo "KSU_VERSION: $(grep -m1 -E 'KSU_VERSION' kernel/Makefile 2>/dev/null || echo n/a)"
          cd "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          mv /tmp/ksu KernelSU
          ls -ld KernelSU drivers/kernelsu 2>/dev/null || true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev python3 zip unzip curl git clang lld llvm dwarves \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Enable config symbols
        run: |
          D=arch/arm64/configs/exynos9810-crownlte_defconfig
          add() { grep -q "^$1=" "$D" || echo "$1" >> "$D"; }
          # This 4.9 tree has NO NETFILTER_XT_TARGET_TTL symbol and no xt_TTL.c:
          # xt_HL.c registers BOTH the IPv4 TTL and IPv6 HL targets, and Kconfig
          # gates them on NETFILTER_XT_TARGET_HL. The match side is _MATCH_HL
          # (there is no NETFILTER_XT_MATCH_TTL either).
          add CONFIG_NETFILTER_ADVANCED=y
          add CONFIG_NETFILTER_XT_TARGET_HL=y
          add CONFIG_NETFILTER_XT_MATCH_HL=y
          add CONFIG_IP_NF_MANGLE=y
          # tethered throughput / latency
          add CONFIG_TCP_CONG_ADVANCED=y
          add CONFIG_TCP_CONG_BBR=y
          add CONFIG_NET_SCH_FQ=y
          add CONFIG_NET_SCH_FQ_CODEL=y
          # zram + KernelSU mount needs
          add CONFIG_CRYPTO_LZ4=y
          add CONFIG_CRYPTO_LZ4HC=y
          add CONFIG_ZRAM_DEF_COMP_LZ4=y
          add CONFIG_TMPFS_XATTR=y
          # NOTE: no USB Ethernet symbols here. The stock v3.3.0 kernel already
          # drives the RTL8153 dongle (Ethernet tethering works out of the box),
          # so adding USB_RTL8152 etc. is unnecessary.
          # drop the "-ies" suffix (SUSFS masks uname, but don't ship a tell)
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' "$D" || true
          grep -q '^CONFIG_LOCALVERSION=' "$D" || echo 'CONFIG_LOCALVERSION=""' >> "$D"
          echo "--- tail of defconfig ---"
          tail -14 "$D"

      - name: Configure
        run: |
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos9810-crownlte_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify config gate
        run: |
          C=out/.config
          echo "=== must be =y (build fails otherwise) ==="
          for s in NETFILTER_XT_TARGET_HL NETFILTER_XT_MATCH_HL \
                   NETFILTER_ADVANCED IP_NF_MANGLE; do
            v=$(grep -E "^CONFIG_${s}=" "$C" || echo "CONFIG_${s}=MISSING")
            echo "$v"
            case "$v" in *=y) ;; *) echo "FATAL: $s not enabled"; exit 1 ;; esac
          done

          echo "=== KernelSU must survive ==="
          grep -E "^CONFIG_KSU=" "$C" || echo "WARN: no CONFIG_KSU in .config"
          grep -iE "susfs" "$C" || echo "note: SUSFS has no Kconfig symbol here (source-patched) - expected"

          echo "=== optional: report what actually took effect ==="
          for s in TCP_CONG_BBR NET_SCH_FQ NET_SCH_FQ_CODEL ZRAM_DEF_COMP_LZ4 \
                   TMPFS_XATTR CRYPTO_LZ4HC; do
            grep -E "^CONFIG_${s}=" "$C" || echo "CONFIG_${s} not set"
          done
          grep -E '^CONFIG_DEFAULT_TCP_CONG=' "$C" || true
          grep -E '^CONFIG_LOCALVERSION=' "$C" || true

      - name: Build
        run: |
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
